name: Check
# Pull requests get the quick checks on every push. The browser suite runs on
# the Mac before merging (`bun run verify`); here it runs only when started by
# hand (`gh workflow run check.yml --ref <branch>`), for example before a
# release. Docs-only changes start nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # About 3 minutes; a minute or so when Turbo replays unchanged workspaces.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Turbo remote cache
        # Trades this job's GitHub OIDC token for a short-lived token to Turbo's
        # cache on Vercel (team orvibo's Turborepo CLI policy). If that fails,
        # every task runs from scratch instead.
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        # A route that can't produce its static shell only fails at build time.
        run: bun run build --filter=@coinslite/app --filter=@coinslite/web
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      - name: Backend tests
        run: bun run test

  smoke:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Each shard: about 4 minutes of setup and 8 of journeys, one at a time.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: smoke (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: tooling/e2e
        run: bunx playwright install --with-deps chromium
      - name: Local test backend
        # An anonymous local Convex deployment that keeps emails in an outbox,
        # so the account journeys can read their codes. Needs no account or secrets.
        run: bash packages/backend/scripts/setup-e2e-backend.sh
      - name: Smoke tests
        run: bun run test:e2e --shard=${{ matrix.shard }}/2
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          E2E_LOCAL_BACKEND: "1"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: tooling/e2e/test-results
          retention-days: 7
