name: Check
on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        # A route that can't produce its static shell only fails at build time.
        run: bun run build --filter=@coinslite/app --filter=@coinslite/web
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      - name: Backend tests
        run: bun run test
      - name: Install Playwright browser
        working-directory: tooling/e2e
        run: bunx playwright install --with-deps chromium
      - name: Local test backend
        # An anonymous local Convex deployment that keeps emails in an outbox,
        # so the account journeys can read their codes. Needs no account or secrets.
        run: bash packages/backend/scripts/setup-e2e-backend.sh
      - name: Smoke tests
        run: bun run test:e2e
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          E2E_LOCAL_BACKEND: "1"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tooling/e2e/test-results
          retention-days: 7
