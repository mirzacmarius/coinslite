name: Browser journeys
# Every Playwright journey against an anonymous local Convex backend, split
# across 2 machines. The Mac runs them before each merge (`bun run verify`);
# start this by hand, for example before a release:
# `gh workflow run e2e.yml --ref <branch>`.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    # Each shard: about 4 minutes of setup and 8 of journeys, one at a time.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: journeys (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: tooling/e2e
        run: bunx playwright install --with-deps chromium
      - name: Local test backend
        # An anonymous local Convex deployment that keeps emails in an outbox,
        # so the account journeys can read their codes. Needs no account or secrets.
        run: bash packages/backend/scripts/setup-e2e-backend.sh
      - name: Journeys
        run: bun run test:e2e --shard=${{ matrix.shard }}/2
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          E2E_LOCAL_BACKEND: "1"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: tooling/e2e/test-results
          retention-days: 7
